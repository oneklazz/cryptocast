[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptocast-core"
version = "0.3.0"
description = "Reusable forecasting core for cryptocurrency price prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "prophet>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/oneklazz/cryptocast"

[tool.hatch.build.targets.wheel]
packages = ["core"]